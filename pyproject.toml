[build-system]
requires      = ["setuptools~=67.6", "wheel~=0.40.0"]
build-backend = "setuptools.build_meta"


[project]
name        = "datoso"
description = "Python command line tool to download and organize your Rom Dat files."
readme      = "README.md"
requires-python = ">=3.11"
license     = {text = "MIT License"}
authors     = [
    {name = 'Lacides Miranda', email = 'laromicas@hotmail.com'},
]
keywords = ["emulators", "roms"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    "Environment :: Console",
    'License :: OSI Approved :: MIT License',
    "Operating System :: POSIX :: Linux",
    'Programming Language :: Python :: 3',
    'Topic :: System :: Emulators',
    'Topic :: System :: Archiving',
]
dependencies = [
    "dataclasses-json>=0.6.7",
    "python-dateutil>=4.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "tinydb>=4.9.0",
    "xmltodict>=1.0.4",
]
dynamic = ["version"]


[project.optional-dependencies]
all = [
    "datoso-seed-fbneo>=1.3.0",
    "datoso-seed-enhanced>=1.3.0",
    "datoso-seed-nointro>=1.3.0",
    "datoso-seed-pleasuredome>=1.3.0",
    "datoso-seed-redump>=1.3.0",
    "datoso-seed-tdc>=1.3.0",
    "datoso-seed-translatedenglish>=1.3.0",
    "datoso-seed-vpinmame>=1.0.2",
    ]
fbneo = [ "datoso-seed-fbneo>=1.3.0" ]
enhanced = [ "datoso-seed-enhanced>=1.3.0" ]
nointro = [ "datoso-seed-nointro>=1.3.0" ]
pleasuredome = [ "datoso-seed-pleasuredome>=1.3.0" ]
redump = [ "datoso-seed-redump>=1.3.0" ]
tdc = [ "datoso-seed-tdc>=1.3.0" ]
translatedenglish = [ "datoso-seed-translatedenglish>=1.3.0" ]
vpinmame = [ "datoso-seed-vpinmame>=1.0.2" ]
dev = [
    # code quality
    "ruff>=0.17.6",
    "line_profiler>=5.1.0",
    "setuptools>=84.2.1",
    ]
test = [
    # test
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
]

[project.urls]
"Source Code"       = "https://github.com/laromicas/datoso"

[project.scripts]
datoso = "datoso.__main__:main"

[tool.setuptools]
packages = [
    "datoso",
    "datoso.actions",
    "datoso.commands",
    "datoso.configuration",
    "datoso.helpers",
    "datoso.repositories",
    "datoso.seeds"
    ]
license-files = ["LICENSE"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "datoso.__version__"}
